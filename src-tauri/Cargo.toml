[package]
name = "osu-cup"
version = "0.1.0"
description = "Турнирник по osu! для своих"
authors = ["osu!cup"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "osu_cup_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Каноничная фича из шаблона Tauri 2: релизная сборка вшивает ассеты фронтенда
# и переводит приложение в production-режим (без неё окно грузит devUrl).
# `tauri build` включает её автоматически, для ручного `cargo build --release`
# передавай: cargo build --release --features custom-protocol
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

rusqlite = { version = "0.32", features = ["bundled", "serde_json"] }

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread", "macros", "net", "process", "io-util"] }

# Сервер эфира: страница зрителя по HTTP и состояние по WebSocket.
axum = { version = "0.8", features = ["ws"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }

anyhow = "1"
thiserror = "2"
regex = "1"
once_cell = "1"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
